name: 构建 APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: 安装 npm 依赖
        run: npm ci

      - name: 生成图标
        run: node generate-icons.js

      - name: 添加 Android 平台
        run: npx cordova platform add android

      - name: 构建调试版 APK
        run: npx cordova build android --debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 家务积分表-APK
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: 构建发布版 APK（仅 main 分支推送时）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 生成临时签名密钥
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias housework \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Housework, OU=Family, O=Home, L=Beijing, ST=Beijing, C=CN"
          # 构建签名 APK
          npx cordova build android --release -- \
            --keystore=debug.keystore \
            --alias=housework \
            --storePassword=android \
            --password=android

      - name: 上传发布版 APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: 家务积分表-APK-Release
          path: platforms/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
